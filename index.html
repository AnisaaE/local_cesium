<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>София в 3D</title>
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.133/Build/Cesium/Widgets/widgets.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="https://cesium.com/downloads/cesiumjs/releases/1.133/Build/Cesium/Cesium.js"></script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main id="cesiumContainer" aria-label="3D карта на София"></main>
    <nav id="presentation" aria-labelledby="presentationTitle" hidden>
      <div class="presentation-header">
        <button id="presentationCollapse" type="button" aria-label="Свий стъпките" aria-expanded="true" aria-controls="presentationSteps">⌃</button>
        <h1 id="presentationTitle" class="panel-drag-handle" tabindex="0" title="Премести панела" aria-keyshortcuts="Shift+ArrowLeft Shift+ArrowRight Shift+ArrowUp Shift+ArrowDown">SOFIA DIGITAL TWIN</h1>
        <div class="presentation-actions">
          <button id="presentationPrevious" type="button" aria-label="Предишна стъпка" disabled>←</button>
          <button type="button" aria-label="Автоматично превъртане" disabled>▶</button>
          <button id="presentationFocus" type="button" title="Върни началния изглед на стъпката">Focus</button>
          <button id="presentationNext" type="button" aria-label="Следваща стъпка" disabled>→</button>
        </div>
      </div>
      <ol id="presentationSteps" aria-label="Стъпки на презентацията"></ol>
    </nav>
    <p id="status" role="status">Зареждат се теренът и сградите на София…</p>
    <div id="slidePanels">
      <aside id="slideInfo" aria-labelledby="slideInfoTitle" hidden>
        <h2 id="slideInfoTitle" class="panel-drag-handle" tabindex="0" title="Премести панела" aria-keyshortcuts="Shift+ArrowLeft Shift+ArrowRight Shift+ArrowUp Shift+ArrowDown"></h2>
        <div id="slideInfoBody" tabindex="0">
          <div id="slideInfoContent"></div>
          <div id="wrfChart" hidden>
            <div class="time-chart-key">
              <span class="time-chart-min">Raster min</span>
              <span class="time-chart-mean">Raster mean</span>
              <span class="time-chart-max">Raster max</span>
              <span class="time-chart-point">Selected point</span>
            </div>
            <p id="wrfChartSample"></p>
            <svg viewBox="0 0 340 164" role="img" aria-labelledby="wrfChartTitle">
              <title id="wrfChartTitle">Raster and selected location history</title>
              <path class="wrf-chart-grid" d="M42 14H328 M42 138H328" />
              <text id="wrfChartMax" x="34" y="18" text-anchor="end"></text>
              <text id="wrfChartMin" x="34" y="142" text-anchor="end"></text>
              <text id="wrfChartStart" x="42" y="157"></text>
              <text id="wrfChartEnd" x="328" y="157" text-anchor="end"></text>
              <path id="wrfChartMaximum" class="time-chart-series max" />
              <path id="wrfChartMean" class="time-chart-series mean" />
              <path id="wrfChartMinimum" class="time-chart-series min" />
              <path id="wrfChartPoint" class="time-chart-series point" />
              <line id="wrfChartCursor" x1="0" x2="0" y1="14" y2="138" />
            </svg>
            <p id="wrfChartTemperature"></p>
          </div>
        </div>
      </aside>
      <section id="wrfTimePanel" aria-labelledby="wrfTitle" hidden>
        <div class="wrf-time-header">
          <h2 id="wrfTitle">Time layer · summer land surface temperature</h2>
          <output id="wrfTimestamp" for="wrfHour"></output>
        </div>
        <label class="wrf-dataset-label" for="wrfDataset">Time layer dataset</label>
        <select id="wrfDataset" aria-label="Time layer dataset">
          <option value="lst">Summer surface temperature</option>
          <option value="wind">10 m wind speed (hourly)</option>
        </select>
        <div class="wrf-time-controls">
          <button id="wrfPlay" type="button">Play</button>
          <input id="wrfHour" type="range" min="0" max="0" step="1" value="0" aria-label="Summer year" />
        </div>
        <div id="wrfRamp" aria-hidden="true"></div>
        <div class="wrf-scale"><span id="wrfMin"></span><span id="wrfMax"></span></div>
        <div id="wrfMessage" role="status"></div>
      </section>
    </div>
    <aside id="layerLegends" aria-label="Легенда на картата" hidden></aside>
  </body>
</html>
